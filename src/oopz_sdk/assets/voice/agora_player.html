<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Agora Player</title>
</head>
<body>
<script>
/**
 * Oopz voice browser backend page.
 *
 * Important mapping observed from the real client:
 * - Agora Web SDK joins with mode="live", role="host", codec="vp8".
 * - Oopz voice API data.supplierSign is the play_urlAgora token/channel_key.
 * - Oopz voice API data.roomId is the Agora channelName.
 * - The Oopz API data.appId may be 0; do not use it as Agora app id.
 * - data_stream payload uses:
 *     uid = Oopz internal string uid, e.g. 6ad0261bc4eb41e882692531981a0972
 *     cid = Agora numeric uid returned/used by join, e.g. 374010679
 *     m   = mic muted flag: 0 active, 1 muted
 *     hm  = speaker/deafen flag: 0 normal, 1 muted/deafened
 */

/* -------------------- WebSocket capture for data_stream bridge -------------------- */

const _wsInstances = [];
const _OrigWS = window.WebSocket;

window.WebSocket = function(url, protocols) {
  const ws = protocols ? new _OrigWS(url, protocols) : new _OrigWS(url);
  _wsInstances.push(ws);

  ws.addEventListener("open", () => {
    console.log("[WS open]", url);
  });

  ws.addEventListener("close", (ev) => {
    console.log("[WS close]", url, ev.code, ev.reason);
  });

  ws.addEventListener("error", () => {
    console.log("[WS error]", url);
  });

  return ws;
};

window.WebSocket.prototype = _OrigWS.prototype;
window.WebSocket.CONNECTING = _OrigWS.CONNECTING;
window.WebSocket.OPEN = _OrigWS.OPEN;
window.WebSocket.CLOSING = _OrigWS.CLOSING;
window.WebSocket.CLOSED = _OrigWS.CLOSED;

function getAgoraSignalWs() {
  const edgeWs = _wsInstances.find((w) =>
    w.readyState === WebSocket.OPEN &&
    typeof w.url === "string" &&
    w.url.includes("edge.sd-rtn.com")
  );

  if (edgeWs) return edgeWs;
  return _wsInstances.find((w) => w.readyState === WebSocket.OPEN) || null;
}

async function waitForAgoraSignalWs(timeoutMs = 3000) {
  const start = performance.now();

  while (performance.now() - start < timeoutMs) {
    const ws = getAgoraSignalWs();
    if (ws) return ws;
    await new Promise((resolve) => setTimeout(resolve, 50));
  }

  return null;
}

window.agoraWsUrls = () => _wsInstances.map((w) => ({
  url: w.url,
  readyState: w.readyState,
}));

/* -------------------- Agora SDK loader -------------------- */

async function loadAgoraSdk() {
  if (typeof AgoraRTC !== "undefined") return;

  const sdkUrl =
    window.AGORA_SDK_URL ||
    "https://download.agora.io/sdk/release/AgoraRTC_N.js";

  await new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = sdkUrl;
    script.onload = () => resolve();
    script.onerror = () => reject(new Error(`failed to load Agora SDK: ${sdkUrl}`));
    document.head.appendChild(script);
  });
}

/* -------------------- Audio decode context -------------------- */

let decodeAudioContext = null;

function getDecodeAudioContext() {
  if (!decodeAudioContext) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) {
      throw new Error("AudioContext is not supported in this browser");
    }
    decodeAudioContext = new Ctx();
  }
  return decodeAudioContext;
}

async function decodeBase64ToAudioBuffer(base64Data) {
  const binary = atob(base64Data);
  const bytes = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  const arrayBuffer = bytes.buffer.slice(
    bytes.byteOffset,
    bytes.byteOffset + bytes.byteLength
  );

  const audioContext = getDecodeAudioContext();
  return await audioContext.decodeAudioData(arrayBuffer);
}

/* -------------------- Global runtime state -------------------- */

let client = null;
let _state = "idle";
let _playGen = 0;
let _currentVolume = 100;

let currentAgoraUid = null;
let currentOopzUid = null;
let currentMicMuted = false;
let currentSpeakerMuted = false;

let activePlayback = null;

window.agoraReady = () => typeof AgoraRTC !== "undefined";
window.agoraState = () => _state;

function setState(nextState) {
  _state = nextState;
}

function shortId() {
  return Math.random().toString(16).slice(2, 8).padEnd(6, "0");
}

function getCurrentTrack() {
  return activePlayback ? activePlayback.track : null;
}

function isCurrentPlayback(playback) {
  return !!playback &&
    !!activePlayback &&
    playback.gen === activePlayback.gen &&
    playback.track === activePlayback.track;
}

/* -------------------- Voice state bridge -------------------- */

/* 接收侧：各客户端用 Agora sendStreamMessage 广播 {m, uid, cid, hm}
   （发送侧见下方 buildVoiceStatePayload），对应事件是 "stream-message"。
   在补上这一段之前只发不收，所以成员页的麦克风/扬声器永远是「未知」——
   Oopz 的 REST（membersByChannels）与网关事件都不带这个状态。 */
const voiceStates = new Map(); // oopz uid -> {m, hm, cid, ts}
let voiceStateRxCount = 0;

function rememberVoiceState(state) {
  const uid = String(state?.uid ?? "").trim();
  if (!uid) return false;

  const m = Number(state.m);
  const hm = Number(state.hm);
  const cid = Number(state.cid);
  voiceStates.set(uid, {
    m: Number.isFinite(m) ? (m ? 1 : 0) : null,
    hm: Number.isFinite(hm) ? (hm ? 1 : 0) : null,
    cid: Number.isFinite(cid) ? cid : null,
    ts: Date.now(),
  });

  if (typeof window.oopzPushVoiceState === "function") {
    try {
      window.oopzPushVoiceState(uid, JSON.stringify(voiceStates.get(uid)));
    } catch (e) {
      console.warn("[voice state] push to python failed", e);
    }
  }
  return true;
}

function decodeStreamMessage(payload) {
  try {
    if (payload instanceof Uint8Array) {
      return JSON.parse(new TextDecoder("utf-8").decode(payload));
    }
    if (payload instanceof ArrayBuffer) {
      return JSON.parse(new TextDecoder("utf-8").decode(new Uint8Array(payload)));
    }
    if (typeof payload === "string") {
      return JSON.parse(payload);
    }
    if (payload && typeof payload === "object") {
      return payload;
    }
  } catch (e) {
    return null;
  }
  return null;
}

function ensureVoiceStateHook() {
  if (!client || client.__oopzVoiceStateHooked) return;
  client.__oopzVoiceStateHooked = true;
  client.on("stream-message", (uid, payload) => {
    const state = decodeStreamMessage(payload);
    if (!state || (state.m === undefined && state.hm === undefined)) {
      return;
    }
    voiceStateRxCount += 1;
    // payload 自带 Oopz uid；只有 Agora 数字 uid 的消息映射不到人，只能计数
    rememberVoiceState(state.uid === undefined ? { ...state, uid: null } : state);
  });
}

// 供 Python 侧按需拉取（消息可能在 Python 注册回调之前就到了）
window.agoraVoiceStates = () => ({
  rx: voiceStateRxCount,
  states: Object.fromEntries(voiceStates),
});

function buildVoiceStatePayload(oopzUid, agoraUid, micMuted, speakerMuted) {
  return {
    m: micMuted ? 1 : 0,
    uid: String(oopzUid),
    cid: Number(agoraUid),
    hm: speakerMuted ? 1 : 0,
  };
}

async function sendVoiceStateRaw(oopzUid, agoraUid, micMuted, speakerMuted, repeat = 2) {
  if (!oopzUid) {
    return { ok: false, error: "oopzUid is required" };
  }

  if (agoraUid === null || agoraUid === undefined || Number.isNaN(Number(agoraUid))) {
    return { ok: false, error: "valid agoraUid is required" };
  }

  try {
    const statePayload = buildVoiceStatePayload(
      oopzUid,
      agoraUid,
      micMuted,
      speakerMuted
    );

    // AgoraRTC_N.js exposes sendStreamMessage on the live client. Use it so
    // the SDK assigns the correct signaling request id/timestamp and waits for
    // the gateway acknowledgement. Writing JSON straight to the captured
    // WebSocket can appear successful locally while Oopz never receives the
    // identity, which leaves audio audible but removes the bot from the voice
    // member list shortly afterwards.
    if (client && typeof client.sendStreamMessage === "function") {
      const message = JSON.stringify(statePayload);
      for (let i = 0; i < repeat; i++) {
        await client.sendStreamMessage({
          payload: message,
          syncWithAudio: false,
        });
      }
      console.log("[voice state]", statePayload, "transport=agora-client");
      // 自己也进状态表，否则成员页里 bot 这一行永远是「未知」
      rememberVoiceState(statePayload);
      return {
        ok: true,
        transport: "agora-client",
        payload: statePayload,
      };
    }

    // Compatibility fallback for older SDK builds that do not expose the
    // client method. A failed native send must not fall through here: its
    // exception is returned to Python so Voice.join can roll the join back.
    const ws = await waitForAgoraSignalWs(3000);
    if (!ws) {
      return { ok: false, error: "no native data stream API or open agora ws" };
    }

    const payload = btoa(JSON.stringify(statePayload));
    const sendTs = Math.floor(performance.now());

    for (let i = 0; i < repeat; i++) {
      ws.send(
        JSON.stringify({
          _id: shortId(),
          _type: "data_stream",
          _message: {
            payload,
            syncWithAudio: false,
            sendTs: sendTs + i * 2,
          },
        })
      );
    }

    console.log("[voice state]", statePayload, "ws=", ws.url);

    return {
      ok: true,
      transport: "raw-websocket-fallback",
      ws: ws.url,
      payload: statePayload,
    };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
}

async function sendCurrentVoiceState(repeat = 2) {
  if (!currentOopzUid || currentAgoraUid === null || currentAgoraUid === undefined) {
    return {
      ok: false,
      error: "voice identity is not ready",
      currentOopzUid,
      currentAgoraUid,
    };
  }

  return await sendVoiceStateRaw(
    currentOopzUid,
    currentAgoraUid,
    currentMicMuted,
    currentSpeakerMuted,
    repeat
  );
}

window.agoraSetVoiceIdentity = async (oopzUid, agoraUid = currentAgoraUid) => {
  currentOopzUid = oopzUid || currentOopzUid;

  if (agoraUid !== undefined && agoraUid !== null) {
    currentAgoraUid = Number(agoraUid);
  }

  return await sendCurrentVoiceState(2);
};

window.agoraSetVoiceState = async (micMuted, speakerMuted = currentSpeakerMuted) => {
  currentMicMuted = !!micMuted;
  currentSpeakerMuted = !!speakerMuted;
  return await sendCurrentVoiceState(2);
};

// Compatibility with older Python calls.
window.agoraSendIdentity = async (oopzUid, agoraUid = currentAgoraUid) => {
  currentOopzUid = oopzUid || currentOopzUid;

  if (agoraUid !== undefined && agoraUid !== null) {
    currentAgoraUid = Number(agoraUid);
  }

  return await sendCurrentVoiceState(2);
};

/* -------------------- Track cleanup helpers -------------------- */

async function unpublishTrackSafely(track) {
  if (!track || !client) return;
  try {
    await client.unpublish([track]);
  } catch (_) {}
}

function closeTrackSafely(track) {
  if (!track) return;
  try {
    track.close();
  } catch (_) {}
}

function stopProcessAudioBufferSafely(track) {
  if (!track) return;
  try {
    track.stopProcessAudioBuffer();
  } catch (_) {}
}

async function cleanupPlaybackResources(
  playback,
  { stopProcessing = true, unpublish = true } = {}
) {
  if (!playback) return;

  const { track } = playback;

  if (stopProcessing) {
    stopProcessAudioBufferSafely(track);
  }

  if (unpublish) {
    await unpublishTrackSafely(track);
  }

  closeTrackSafely(track);
}

async function stopCurrentPlayback({ bumpGen = true, nextState = "joined" } = {}) {
  const playback = activePlayback;

  if (bumpGen) {
    _playGen += 1;
  }

  activePlayback = null;

  if (playback) {
    await cleanupPlaybackResources(playback, {
      stopProcessing: true,
      unpublish: true,
    });
  }

  setState(nextState);
}

async function finalizeStoppedPlayback(playback) {
  if (!isCurrentPlayback(playback)) {
    return;
  }

  activePlayback = null;

  await cleanupPlaybackResources(playback, {
    stopProcessing: false,
    unpublish: true,
  });

  if (playback.gen === _playGen) {
    setState("joined");
  }
}

function bindPlaybackEvents(playback) {
  const { track, gen } = playback;

  track.on("source-state-change", (st) => {
    if (!isCurrentPlayback(playback)) return;
    if (gen !== _playGen) return;

    console.log("[source-state-change]", st);

    if (st === "playing") {
      setState("playing");
      return;
    }

    if (st === "paused") {
      setState("paused");
      return;
    }

    if (st === "stopped") {
      setState("finished");
      void finalizeStoppedPlayback(playback);
    }
  });
}

function makePlayback(track) {
  return {
    gen: _playGen,
    track,
  };
}

/* -------------------- Join / Leave -------------------- */

window.agoraJoin = async (appId, token, channelName, uid) => {
  try {
    await loadAgoraSdk();

    if (client) {
      await window.agoraLeave();
    }

    client = AgoraRTC.createClient({
      mode: "live",
      codec: "vp8",
    });

    await client.setClientRole("host");

    // 接收房间内其他人的静音状态广播（与 listenEnabled 无关）
    ensureVoiceStateHook();

    const expectedUid = uid === null || uid === undefined ? null : Number(uid);

    const assignedUid = await client.join(
      String(appId),
      String(channelName),
      token || null,
      expectedUid
    );

    currentAgoraUid = Number(assignedUid);

    if (expectedUid !== null && currentAgoraUid !== expectedUid) {
      console.warn(
        "[Agora uid mismatch]",
        "expected=", expectedUid,
        "assigned=", currentAgoraUid
      );
    }
    setState("joined");

    return {
      ok: true,
      uid: currentAgoraUid,
    };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraLeave = async () => {
  await stopCurrentPlayback({ bumpGen: true, nextState: "joined" });

  if (client) {
    try {
      await client.leave();
    } catch (_) {}
    client = null;
  }

  currentAgoraUid = null;
  // 退房后上一次房间的状态就无效了，必须清掉，否则会把旧状态当成本房状态显示
  voiceStates.clear();
  // 播放队列同理：都是上一场会话的排期
  ttsNextTime = 0;
  for (const src of Array.from(ttsSources)) {
    try { src.stop(); } catch (_) {}
  }
  ttsSources.clear();
  ttsPlaying = false;
  setState("idle");
};

/* -------------------- Playback core -------------------- */

async function publishTrackAsPlayback(localTrack, gen) {
  if (gen !== _playGen) {
    closeTrackSafely(localTrack);
    return { ok: false, error: "superseded" };
  }

  const playback = makePlayback(localTrack);
  activePlayback = playback;
  bindPlaybackEvents(playback);

  // Every song uses a newly-created Agora track. Apply the persisted volume
  // before audio starts so the first samples do not play at the SDK default.
  localTrack.setVolume(_currentVolume);
  localTrack.startProcessAudioBuffer({ loop: false });
  await client.publish([localTrack]);

  // After publish, refresh identity/state again. This matches the real client more closely.
  // publish 成功后，补发一次 uid/cid + 当前 m/hm 状态。
  // 此时 Agora signaling WS 通常已经存在。
  await sendCurrentVoiceState(2);

  if (!isCurrentPlayback(playback) || gen !== _playGen) {
    await cleanupPlaybackResources(playback, {
      stopProcessing: true,
      unpublish: true,
    });
    return { ok: false, error: "superseded" };
  }

  setState("playing");

  return {
    ok: true,
    duration: localTrack.duration,
    agoraUid: currentAgoraUid,
  };
}

window.agoraPlayAudio = async (url) => {
  const gen = ++_playGen;
  let localTrack = null;

  try {
    await loadAgoraSdk();

    if (!client) {
      return { ok: false, error: "not joined" };
    }

    await stopCurrentPlayback({ bumpGen: false, nextState: "joined" });

    localTrack = await AgoraRTC.createBufferSourceAudioTrack({
      source: url,
      cacheOnlineFile: false,
    });

    return await publishTrackAsPlayback(localTrack, gen);
  } catch (e) {
    if (localTrack) {
      await cleanupPlaybackResources({ gen, track: localTrack }, {
        stopProcessing: true,
        unpublish: true,
      });
    }

    if (activePlayback && activePlayback.track === localTrack) {
      activePlayback = null;
    }

    if (gen !== _playGen) {
      return { ok: false, error: "superseded" };
    }
    setState(client ? "joined" : "idle");
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraPlayLocal = async (base64Data, mimeType) => {
  const gen = ++_playGen;
  let localTrack = null;

  try {
    await loadAgoraSdk();

    if (!client) {
      return { ok: false, error: "not joined" };
    }

    await stopCurrentPlayback({ bumpGen: false, nextState: "joined" });

    const audioBuffer = await decodeBase64ToAudioBuffer(base64Data);

    if (gen !== _playGen) {
      return { ok: false, error: "superseded" };
    }

    localTrack = await AgoraRTC.createBufferSourceAudioTrack({
      source: audioBuffer,
      cacheOnlineFile: false,
    });

    return await publishTrackAsPlayback(localTrack, gen);
  } catch (e) {
    if (localTrack) {
      await cleanupPlaybackResources({ gen, track: localTrack }, {
        stopProcessing: true,
        unpublish: true,
      });
    }

    if (activePlayback && activePlayback.track === localTrack) {
      activePlayback = null;
    }

    if (gen !== _playGen) {
      return { ok: false, error: "superseded" };
    }

    setState(client ? "joined" : "idle");
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraStopAudio = async () => {
  await stopCurrentPlayback({ bumpGen: true, nextState: "joined" });
};

/* -------------------- Playback controls -------------------- */

window.agoraPause = () => {
  const track = getCurrentTrack();
  if (!track || _state !== "playing") {
    return { ok: false, error: "not playing" };
  }

  try {
    track.pauseProcessAudioBuffer();
    setState("paused");
    return { ok: true };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraResume = () => {
  const track = getCurrentTrack();
  if (!track || _state !== "paused") {
    return { ok: false, error: "not paused" };
  }

  try {
    track.resumeProcessAudioBuffer();
    setState("playing");
    return { ok: true };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraSeek = (time) => {
  const track = getCurrentTrack();
  if (!track) {
    return { ok: false, error: "no track" };
  }

  try {
    track.seekAudioBuffer(time);
    return { ok: true };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraSetVolume = (vol) => {
  const parsed = Number(vol);
  if (!Number.isFinite(parsed)) {
    return { ok: false, error: "invalid volume" };
  }

  _currentVolume = Math.max(0, Math.min(100, parsed));
  const track = getCurrentTrack();
  if (!track) {
    // Joining the voice channel happens before the first audio track exists.
    // Keep the value so publishTrackAsPlayback can apply it to that track.
    return { ok: true, pending: true, volume: _currentVolume };
  }

  try {
    track.setVolume(_currentVolume);
    return { ok: true, volume: _currentVolume };
  } catch (e) {
    return { ok: false, error: e?.message || String(e) };
  }
};

window.agoraGetCurrentTime = () => {
  const track = getCurrentTrack();
  if (!track) return 0;

  try {
    return track.getCurrentTime();
  } catch (_) {
    return 0;
  }
};

/* -------------------- Debug status -------------------- */

window.agoraGetStatus = () => {
  const track = getCurrentTrack();

  let currentTime = 0;
  let duration = 0;

  try {
    currentTime = track ? track.getCurrentTime() : 0;
  } catch (_) {}

  try {
    duration = track ? track.duration : 0;
  } catch (_) {}

  return {
    state: _state,
    hasClient: !!client,
    currentOopzUid,
    currentAgoraUid,
    currentMicMuted,
    currentSpeakerMuted,
    currentVolume: _currentVolume,
    hasTrack: !!track,
    currentTime,
    duration,
    ws: window.agoraWsUrls(),
  };
};

/* -------------------- Duplex: listen remote + push TTS -------------------- */

let listenEnabled = false;
const remoteCaptures = new Map(); // uid -> {processor, source, ctx}

let ttsCtx = null;
let ttsDest = null;
let ttsTrack = null;
let ttsPublished = false;
let ttsPlaying = false;
// 推流播放队列：Live 的分片常常快于实时到达（实测 5.76s 音频在 1.29s 内到齐），
// 必须按时间轴排队播放，否则每片都「立即开始」会叠成一团噪音。
let ttsNextTime = 0;        // 下一片应当开始播放的 AudioContext 时刻
const ttsSources = new Set(); // 已排期未播完的 source，用于打断
const TTS_LEAD = 0.08;      // 首片/欠载后预留的缓冲（秒），吸收到达抖动

function floatTo16BitPCM(float32) {
  const out = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    let s = Math.max(-1, Math.min(1, float32[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

function base64ToUint8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function base64ToInt16(b64) {
  const bytes = base64ToUint8(b64);
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const out = new Int16Array(bytes.length >> 1);
  for (let i = 0; i < out.length; i++) out[i] = view.getInt16(i * 2, true);
  return out;
}

async function emitRemotePcm(uid, int16, sampleRate) {
  if (!listenEnabled || !int16.length) return;
  // 100ms 一块，降低 IPC 压力
  const bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  const b64 = btoa(bin);
  try {
    if (typeof window.oopzPushRemotePcm === "function") {
      await window.oopzPushRemotePcm(String(uid), b64, sampleRate);
    }
  } catch (e) {
    console.warn("[duplex] push remote pcm failed", e);
  }
}

function stopRemoteCapture(uid) {
  const cap = remoteCaptures.get(uid);
  if (!cap) return;
  try { cap.processor.disconnect(); } catch (_) {}
  try { cap.source.disconnect(); } catch (_) {}
  try { cap.ctx.close(); } catch (_) {}
  remoteCaptures.delete(uid);
}

function stopAllRemoteCaptures() {
  for (const uid of Array.from(remoteCaptures.keys())) stopRemoteCapture(uid);
}

async function startRemoteCapture(user) {
  const uid = String(user.uid);
  if (remoteCaptures.has(uid)) return;
  if (!user.audioTrack) return;
  try {
    const mst = user.audioTrack.getMediaStreamTrack();
    const ctx = new AudioContext({ sampleRate: 16000 });
    const src = ctx.createMediaStreamSource(new MediaStream([mst]));
    const processor = ctx.createScriptProcessor(4096, 1, 1);
    let pending = [];
    let pendingSamples = 0;
    const flushSamples = 1600; // 100ms @16k

    processor.onaudioprocess = (ev) => {
      if (!listenEnabled) return;
      const input = ev.inputBuffer.getChannelData(0);
      const pcm = floatTo16BitPCM(input);
      pending.push(pcm);
      pendingSamples += pcm.length;
      if (pendingSamples >= flushSamples) {
        const merged = new Int16Array(pendingSamples);
        let off = 0;
        for (const part of pending) {
          merged.set(part, off);
          off += part.length;
        }
        pending = [];
        pendingSamples = 0;
        emitRemotePcm(uid, merged, 16000);
      }
    };

    const mute = ctx.createGain();
    mute.gain.value = 0;
    src.connect(processor);
    processor.connect(mute);
    mute.connect(ctx.destination);
    remoteCaptures.set(uid, { ctx, src, processor, mute });
    console.log("[duplex] capture started", uid);
  } catch (e) {
    console.warn("[duplex] start capture failed", uid, e);
  }
}

function ensureClientDuplexHooks() {
  if (!client || client.__oopzDuplexHooked) return;
  client.__oopzDuplexHooked = true;
  client.on("user-published", async (user, mediaType) => {
    try {
      await client.subscribe(user, mediaType);
    } catch (e) {
      console.warn("[duplex] subscribe failed", e);
      return;
    }
    if (mediaType === "audio" && listenEnabled) {
      await startRemoteCapture(user);
    }
  });
  client.on("user-unpublished", (user, mediaType) => {
    if (mediaType === "audio") stopRemoteCapture(String(user.uid));
  });
  client.on("user-left", (user) => stopRemoteCapture(String(user.uid)));
}

window.agoraSetListen = async (enabled) => {
  listenEnabled = !!enabled;
  if (!listenEnabled) {
    stopAllRemoteCaptures();
    return { ok: true, listen: false };
  }
  if (!client) return { ok: false, error: "not joined" };
  ensureClientDuplexHooks();
  // 已在房用户
  try {
    const users = client.remoteUsers || [];
    for (const user of users) {
      if (user.hasAudio) {
        try {
          await client.subscribe(user, "audio");
        } catch (_) {}
        await startRemoteCapture(user);
      }
    }
  } catch (e) {
    console.warn("[duplex] resubscribe failed", e);
  }
  return { ok: true, listen: true };
};

async function ensureTtsTrack(sampleRate) {
  if (!client) throw new Error("not joined");
  if (!ttsCtx) {
    ttsCtx = new AudioContext({ sampleRate: sampleRate || 24000 });
    ttsDest = ttsCtx.createMediaStreamDestination();
    ttsNextTime = 0; // 新上下文时间轴从 0 起算
    const mst = ttsDest.stream.getAudioTracks()[0];
    ttsTrack = AgoraRTC.createCustomAudioTrack({ mediaStreamTrack: mst });
    ttsTrack.setVolume(_currentVolume);
  }
  if (!ttsPublished && ttsTrack) {
    await client.publish([ttsTrack]);
    ttsPublished = true;
  }
  return ttsTrack;
}

window.agoraStopTts = async () => {
  // 本来就没什么在播（没有分片在队列里、也不在播），直接返回：省掉下面那次
  // 30ms 静音窗口。服务端判定抢话后本地还会再 stop 一次，那一次通常就落在
  // 这个分支里 —— 而 stop_tts 在远端音频热路径上，白等的 30ms 没必要。
  const hadAudio = ttsPlaying || ttsSources.size > 0;
  ttsPlaying = false;
  // 队列里的分片要真正停掉：只调音量的话，已排期的 source 会在音量恢复后继续播。
  ttsNextTime = 0;
  for (const src of Array.from(ttsSources)) {
    try { src.stop(); } catch (_) {}
    try { src.disconnect(); } catch (_) {}
  }
  ttsSources.clear();
  if (!hadAudio) return { ok: true };
  try {
    if (ttsTrack) ttsTrack.stopProcessAudioBuffer && ttsTrack.stopProcessAudioBuffer();
  } catch (_) {}
  // CustomAudioTrack 没有 processAudioBuffer；通过静音实现中断
  try {
    if (ttsTrack) ttsTrack.setVolume(0);
    await new Promise((r) => setTimeout(r, 30));
    if (ttsTrack) ttsTrack.setVolume(_currentVolume);
  } catch (_) {}
  return { ok: true };
};

window.agoraPushTtsPcm = async (b64, sampleRate, finish) => {
  try {
    if (!client) return { ok: false, error: "not joined" };
    if (b64 && b64.length) {
      const pcm = base64ToInt16(b64);
      if (pcm.length) {
        await ensureTtsTrack(sampleRate || 24000);
        const buf = ttsCtx.createBuffer(1, pcm.length, sampleRate || 24000);
        const ch = buf.getChannelData(0);
        for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
        const src = ttsCtx.createBufferSource();
        src.buffer = buf;
        src.connect(ttsDest);
        // 接在前一片的尾巴后面排队，而不是「立刻开始」：分片到达快了就攒着慢慢放，
        // 到达抖动了也不会重叠。缓冲耗尽（欠载）时才重新起一个 lead。
        const now = ttsCtx.currentTime;
        let startAt = ttsNextTime;
        if (startAt < now + 0.005) {
          startAt = now + TTS_LEAD;
        }
        src.start(startAt);
        ttsNextTime = startAt + buf.duration;
        ttsSources.add(src);
        src.onended = () => {
          ttsSources.delete(src);
        };
        ttsPlaying = true;
      }
    }
    if (finish) {
      ttsPlaying = false;
    }
    return { ok: true, playing: ttsPlaying, finish: !!finish };
  } catch (e) {
    return { ok: false, error: e && e.message ? e.message : String(e) };
  }
};

// join 成功后挂上 duplex 钩子
const _origJoin = window.agoraJoin;
window.agoraJoin = async (...args) => {
  const result = await _origJoin(...args);
  if (result && result.ok) {
    ensureClientDuplexHooks();
    if (listenEnabled) {
      await window.agoraSetListen(true);
    }
  }
  return result;
};
</script>
