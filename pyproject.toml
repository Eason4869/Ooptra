[tool.ruff]
target-version = "py310"
line-length = 100
# src/oopz_sdk 是内置的官方 SDK 源码，保持与上游逐字一致，不参与本仓库的 lint。
extend-exclude = ["src/oopz_sdk"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["，", "。", "：", "；", "（", "）"]

[tool.ruff.lint.per-file-ignores]
# 入口必须先按脚本位置注入 sys.path，之后才能 import src/* 下的项目模块。
"main.py" = ["E402"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
include = ["main.py", "src"]
exclude = ["**/__pycache__", "src/oopz_sdk"]
ignore = ["src/oopz_sdk"]
