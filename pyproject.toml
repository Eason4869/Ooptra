[tool.ruff]
target-version = "py310"
line-length = 100
# src/oopz_sdk 是内置 SDK，保留其代码风格，不参与本仓库的批量 lint。
# 本地兼容性修复由对应回归测试验证。
extend-exclude = ["src/oopz_sdk"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
# 中文正文里的全角标点，以及语音文本净化必须逐字匹配的全角尖括号/竖线
# （MiMo 的思考链标记会以 ＜think＞ / ｜end▁of▁thinking｜ 的形式出现）。
allowed-confusables = ["，", "。", "：", "；", "（", "）", "！", "？", "＜", "＞", "｜"]

[tool.ruff.lint.per-file-ignores]
# 入口必须先按脚本位置注入 sys.path，之后才能 import src/* 下的项目模块。
"main.py" = ["E402"]

# 显式声明项目自身的一级模块，避免 config.py / private_key.py 这类
# 不随仓库分发的模块在 CI 上被误判为第三方而改变 import 分组。
[tool.ruff.lint.isort]
known-first-party = ["bridge", "config", "core", "onebot_v11", "oopz", "oopz_sdk", "private_key", "webui"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
include = ["main.py", "src"]
exclude = ["**/__pycache__", "src/oopz_sdk"]
ignore = ["src/oopz_sdk"]
