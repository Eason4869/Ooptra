name: CI

on:
  push:
    branches: [main, beta, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .

  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        exclude:
          # Windows 上只跑一个版本，避免矩阵膨胀
          - os: windows-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -v -o faulthandler_timeout=60

  updater-browser:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix .browser-ci --no-audit --no-fund playwright@1.63.0
          .browser-ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Updater browser interactions
        env:
          OOPTRA_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.browser-ci/node_modules/playwright
        run: node tests/browser/maintenance.cjs
