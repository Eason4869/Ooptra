<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Ooptra 3.0.2 运行链路：消息桥接与可选语音 Agent</title>
  <desc id="map-desc">文字链路连接 Oopz 平台、Ooptra 桥接内核和 OneBot v11 对端。语音链路连接 Oopz 语音房、可选语音 Agent 和 Gemini Live 或 MiMo 级联模型。Web 控制台管理两条链路；内核、控制台与 Agent 共用同一进程。</desc>
  <defs>
    <marker id="map-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5Z" fill="#315DDC"/></marker>
    <marker id="map-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5-10 5Z" fill="#167F7A"/></marker>
  </defs>
  <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, sans-serif">
    <rect width="1200" height="720" rx="20" fill="#F5F8FC"/>
    <text x="56" y="63" font-size="30" font-weight="650" fill="#173451">Ooptra 3.0.2 的运行链路</text>
    <text x="56" y="99" font-size="17" fill="#506881">文字事件走 OneBot v11，语音通过可选 Agent 对话。</text>
    <rect x="400" y="133" width="396" height="533" rx="14" fill="#EAF0FA" stroke="#C8D6E9"/>
    <rect x="500" y="120" width="196" height="25" rx="5" fill="#F5F8FC"/>
    <text x="598" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#506881">Ooptra · 同一进程</text>
    <rect x="56" y="164" width="244" height="184" rx="10" fill="#FFFFFF" stroke="#DFE7F0"/>
    <text x="78" y="202" font-size="21" font-weight="650" fill="#173451">Oopz 平台</text>
    <text x="78" y="239" font-size="16" fill="#506881">域 / 频道 / 成员</text>
    <text x="78" y="270" font-size="16" fill="#506881">消息、撤回与频道事件</text>
    <text x="78" y="301" font-size="16" fill="#506881">发送、撤回与管理接口</text>
    <text x="78" y="328" font-size="13" fill="#61768C">登录凭据由 Ooptra 维护</text>
    <rect x="424" y="164" width="348" height="184" rx="10" fill="#FFFFFF" stroke="#A1B5ED"/>
    <path d="M434 164h328" stroke="#315DDC" stroke-width="3"/>
    <text x="446" y="202" font-size="21" font-weight="650" fill="#173451">桥接内核</text>
    <text x="446" y="239" font-size="16" fill="#506881">事件标准化 · 动作分发</text>
    <text x="446" y="270" font-size="16" fill="#506881">SQLite 身份映射 · 凭据刷新</text>
    <text x="446" y="301" font-size="16" fill="#506881">连接维护 · 自动重连</text>
    <text x="446" y="328" font-size="13" fill="#61768C">Oopz SDK 与 OneBot v11 适配</text>
    <rect x="892" y="164" width="252" height="184" rx="10" fill="#FFFFFF" stroke="#DFE7F0"/>
    <text x="914" y="202" font-size="21" font-weight="650" fill="#173451">OneBot 对端框架</text>
    <text x="914" y="239" font-size="16" fill="#506881">监听反向 WebSocket</text>
    <text x="914" y="270" font-size="16" fill="#506881">接收事件 / 调用动作</text>
    <text x="914" y="301" font-size="16" fill="#506881">插件、指令与业务逻辑</text>
    <text x="914" y="328" font-size="13" fill="#61768C">任意 OneBot v11 实现</text>
    <g fill="none" stroke="#315DDC" stroke-width="2" marker-end="url(#map-arrow-blue)">
      <path d="M306 226h111"/><path d="M418 282H307"/>
      <path d="M802 226h83"/><path d="M886 282h-83"/>
    </g>
    <g font-size="14" text-anchor="middle" fill="#315DDC">
      <text x="362" y="213">事件</text><text x="362" y="305">动作</text>
      <text x="844" y="213">事件</text><text x="844" y="305">动作</text>
    </g>
    <path d="M598 348v14M598 423v17" stroke="#BECDE0" stroke-width="2"/>
    <rect x="424" y="362" width="348" height="61" rx="8" fill="#173451"/>
    <text x="446" y="387" font-size="18" font-weight="600" fill="#E2EDF7">Web 控制台 · 默认 3090</text>
    <text x="446" y="408" font-size="13" fill="#B0C2D4">状态 / 日志 / 配置 / 账号 / 语音管理与 API</text>
    <rect x="56" y="464" width="244" height="172" rx="10" fill="#FFFFFF" stroke="#DFE7F0"/>
    <text x="78" y="503" font-size="21" font-weight="650" fill="#173451">Oopz 语音房</text>
    <text x="78" y="540" font-size="16" fill="#506881">房间成员说话</text>
    <text x="78" y="571" font-size="16" fill="#506881">Agora 音频输入 / 输出</text>
    <text x="78" y="602" font-size="16" fill="#506881">播放 bot 的语音回复</text>
    <rect x="424" y="440" width="348" height="211" rx="10" fill="#FFFFFF" stroke="#A5CDC9"/>
    <path d="M434 440h328" stroke="#167F7A" stroke-width="3"/>
    <text x="446" y="479" font-size="21" font-weight="650" fill="#173451">可选语音 Agent</text>
    <text x="446" y="516" font-size="16" fill="#506881">主讲人选择 · 客户端抢话</text>
    <text x="446" y="547" font-size="16" fill="#506881">人格 / 共享记忆 / 语音生成</text>
    <text x="446" y="578" font-size="16" fill="#506881">自动串门：分域、限时、每日上限</text>
    <text x="446" y="609" font-size="16" fill="#506881">进退房意图由 AI 随机改写</text>
    <text x="446" y="635" font-size="13" fill="#61768C">全局默认 + 域覆盖，状态持久化</text>
    <rect x="892" y="464" width="252" height="172" rx="10" fill="#FFFFFF" stroke="#DFE7F0"/>
    <text x="914" y="503" font-size="21" font-weight="650" fill="#173451">语音模型</text>
    <text x="914" y="540" font-size="16" fill="#506881">Gemini Live：端到端语音</text>
    <text x="914" y="571" font-size="16" fill="#506881">MiMo：ASR → LLM → TTS</text>
    <text x="914" y="602" font-size="14" fill="#61768C">在「配置 → 语音模型」中选择</text>
    <g fill="none" stroke="#167F7A" stroke-width="2" marker-end="url(#map-arrow-teal)">
      <path d="M306 532h111"/><path d="M418 580H307"/>
      <path d="M802 532h83"/><path d="M886 580h-83"/>
    </g>
    <g font-size="14" text-anchor="middle" fill="#167F7A">
      <text x="362" y="518">听</text><text x="362" y="607">说</text>
      <text x="844" y="518">输入</text><text x="844" y="607">回复</text>
    </g>
    <text x="56" y="698" font-size="16" fill="#506881">反向 WebSocket 由 Ooptra 主动连接对端；语音模块和各域自动串门默认关闭。</text>
  </g>
</svg>
